<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
body{height:600px;padding:70px 90px}
h1{font-size:96px;max-width:14ch}
.addr{position:absolute;left:90px;bottom:70px;font:500 30px "JetBrains Mono",monospace;color:var(--ink2);letter-spacing:.02em}
.addr b{color:var(--bg);background:var(--acc);padding:4px 12px;font-weight:700;margin-left:6px}
.tag{position:absolute;right:90px;bottom:70px;font:400 20px "JetBrains Mono",monospace;color:var(--ink2);text-align:right;line-height:1.5}
.tag b{color:var(--acc);font-weight:500}
.rc{position:absolute;right:90px;top:150px;width:470px;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);padding:10px 0;font:20px/1.5 "JetBrains Mono",monospace;color:var(--ink2)}
.rc div{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}.rc div:last-child{border-bottom:0}
.rc b{color:var(--ink);font-weight:500}
</style></head><body>
<div class="eye">research / dexscreener enhanced token info</div>
<h1>What does <s>$299</s> actually buy?</h1>
<div class="addr">dexscreener.com/solana/<b>receipt</b></div>
<div class="rc"><div><span>enhanced token info</span><b>$299</b></div><div><span>review of the project</span><b class="mute">none</b></div><div><span>links checked</span><b class="mute">none</b></div><div><span>what every bot reads</span><b class="ok">approved</b></div></div>
<div class="tag">tokenProfile: <b>approved</b><br>one field. one endpoint.</div>
</body></html>
