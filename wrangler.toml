name = "opendex"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "web"

# RPCs the edge functions try in order live in the Pages secret RPC_URLS (comma-separated):
#   npx wrangler pages secret put RPC_URLS --project-name opendex
# Public RPCs rate-limit Cloudflare's shared IPs, so use a keyed one. Without the secret the core's default is used.
[vars]
SITE_ORIGIN = "https://opendex.info"

[[kv_namespaces]]
binding = "OPENDEX_CACHE"
id = "6f4dab0d64f74e0cbed5482a2bd4b681"
