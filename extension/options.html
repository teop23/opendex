<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>opendex options</title>
<style>body{font:14px/1.5 system-ui,sans-serif;padding:16px;min-width:360px}input{width:100%;padding:8px;font-family:ui-monospace,monospace}label{display:block;margin-bottom:6px}button{margin-top:10px;padding:8px 14px}</style>
</head><body>
<label for="rpc">Solana RPC URL (optional; public RPC is rate-limited)</label>
<input id="rpc" placeholder="https://mainnet.helius-rpc.com/?api-key=...">
<button id="save">Save</button> <span id="msg"></span>
<script>
chrome.storage.sync.get({rpc:''},v=>{document.getElementById('rpc').value=v.rpc||''});
document.getElementById('save').onclick=()=>chrome.storage.sync.set({rpc:document.getElementById('rpc').value.trim()},()=>{document.getElementById('msg').textContent='saved'});
</script>
</body></html>
